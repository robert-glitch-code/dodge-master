<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dodge Master 🎮</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            background: #080808;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        h1 { margin: 0 0 10px; font-size: 36px; }
        #gameContainer { position: relative; }
        canvas {
            display: block;
            background: #151515;
            border: 3px solid white;
            border-radius: 10px;
            box-shadow: 0 0 25px rgba(255,255,255,0.15);
        }
        #score, #highScore {
            position: absolute;
            left: 20px;
            z-index: 2;
            font-weight: bold;
        }
        #score { top: 15px; font-size: 22px; }
        #highScore { top: 45px; font-size: 16px; color: #aaa; }
        #gameOver, #startScreen {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.88);
            border-radius: 8px;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            z-index: 10;
        }
        #gameOver { display: none; }
        #startScreen { display: flex; }
        #gameOver h2, #startScreen h2 { font-size: 40px; margin: 0 0 10px; }
        #finalScore { font-size: 22px; margin-bottom: 20px; }
        #startScreen p { color: #aaa; margin-bottom: 20px; }
        button {
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover { transform: scale(1.05); }
        #instructions { margin-top: 15px; color: #aaa; text-align: center; }
    </style>
</head>
<body>
    <h1>🚀 DODGE MASTER</h1>
    <div id="gameContainer">
        <canvas id="game" width="700" height="450"></canvas>
        <div id="score">Score: 0</div>
        <div id="highScore">Best: 0</div>
        <div id="startScreen">
            <h2>Ready? 😈</h2>
            <p>Use the LEFT and RIGHT arrow keys</p>
            <button onclick="startGame()">START GAME</button>
        </div>
        <div id="gameOver">
            <h2>💀 GAME OVER</h2>
            <div id="finalScore">Your score: 0</div>
            <button onclick="restartGame()">PLAY AGAIN</button>
        </div>
    </div>
    <div id="instructions">⬅️ Move Left &nbsp;&nbsp; | &nbsp;&nbsp; Move Right ➡️</div>
    <script>
        const canvas = document.getElementById("game");
        const ctx = canvas.getContext("2d");
        const scoreDisplay = document.getElementById("score");
        const highScoreDisplay = document.getElementById("highScore");
        const gameOverScreen = document.getElementById("gameOver");
        const startScreen = document.getElementById("startScreen");
        const finalScoreDisplay = document.getElementById("finalScore");
        let keys = {}, score = 0, highScore = Number(localStorage.getItem("dodgeHighScore")) || 0;
        let gameRunning = false, animation, spawnTimer = 0, spawnRate = 55, blockSpeed = 4, blocks = [];
        highScoreDisplay.textContent = "Best: " + highScore;
        const player = { x: 325, y: 395, width: 50, height: 30, speed: 8 };
        document.addEventListener("keydown", e => { keys[e.key] = true; if (["ArrowLeft","ArrowRight"].includes(e.key)) e.preventDefault(); });
        document.addEventListener("keyup", e => { keys[e.key] = false; });
        function startGame() {
            startScreen.style.display = "none";
            score = 0; blockSpeed = 4; spawnRate = 55; blocks = []; spawnTimer = 0;
            player.x = canvas.width / 2 - player.width / 2;
            scoreDisplay.textContent = "Score: 0";
            gameRunning = true;
            gameLoop();
        }
        function restartGame() { gameOverScreen.style.display = "none"; startGame(); }
        function createBlock() {
            const size = 25 + Math.random() * 30;
            blocks.push({ x: Math.random() * (canvas.width - size), y: -size, width: size, height: size, speed: blockSpeed });
        }
        function update() {
            if (keys["ArrowLeft"]) player.x -= player.speed;
            if (keys["ArrowRight"]) player.x += player.speed;
            if (player.x < 0) player.x = 0;
            if (player.x + player.width > canvas.width) player.x = canvas.width - player.width;
            spawnTimer++;
            if (spawnTimer >= spawnRate) { createBlock(); spawnTimer = 0; }
            for (let i = blocks.length - 1; i >= 0; i--) {
                blocks[i].y += blocks[i].speed;
                if (player.x < blocks[i].x + blocks[i].width && player.x + player.width > blocks[i].x && player.y < blocks[i].y + blocks[i].height && player.y + player.height > blocks[i].y) { endGame(); return; }
                if (blocks[i].y > canvas.height) {
                    blocks.splice(i, 1); score++; scoreDisplay.textContent = "Score: " + score;
                    if (score % 5 === 0) { blockSpeed += 0.5; if (spawnRate > 25) spawnRate -= 3; }
                }
            }
        }
        function drawBackground() {
            ctx.fillStyle = "#151515"; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#333";
            for (let i = 0; i < 50; i++) ctx.fillRect((i * 97) % canvas.width, (i * 53) % canvas.height, 2, 2);
        }
        function drawPlayer() {
            ctx.fillStyle = "#00ff66"; ctx.fillRect(player.x, player.y, player.width, player.height);
            ctx.fillStyle = "#111"; ctx.fillRect(player.x + 12, player.y + 6, 26, 8);
            ctx.fillStyle = "#777"; ctx.fillRect(player.x + 5, player.y + 25, 10, 8); ctx.fillRect(player.x + 35, player.y + 25, 10, 8);
        }
        function drawBlocks() {
            blocks.forEach(block => {
                ctx.fillStyle = "#ff3333"; ctx.fillRect(block.x, block.y, block.width, block.height);
                ctx.fillStyle = "#ff9999"; ctx.fillRect(block.x + 5, block.y + 5, Math.max(3, block.width / 4), Math.max(3, block.height / 4));
            });
        }
        function draw() { drawBackground(); drawPlayer(); drawBlocks(); }
        function gameLoop() { if (!gameRunning) return; update(); draw(); animation = requestAnimationFrame(gameLoop); }
        function endGame() {
            gameRunning = false; cancelAnimationFrame(animation);
            if (score > highScore) { highScore = score; localStorage.setItem("dodgeHighScore", highScore); highScoreDisplay.textContent = "Best: " + highScore; }
            finalScoreDisplay.textContent = "Your score: " + score;
            gameOverScreen.style.display = "flex";
        }
    </script>
</body>
</html>
